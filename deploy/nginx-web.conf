# Nginx config para app.jobshours.com – Frontend Next.js (PM2)
# Copiar a /etc/nginx/sites-available/jobshours-web y symlink a sites-enabled/
# sudo ln -s /etc/nginx/sites-available/jobshours-web /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name app.jobshours.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.jobshours.com;

    ssl_certificate     /etc/letsencrypt/live/jobshours.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobshours.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/jobshours-web-access.log;
    error_log  /var/log/nginx/jobshours-web-error.log;

    client_max_body_size 20M;

    # Next.js corre en puerto 3000 vía PM2
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos estáticos Next.js con caché agresivo
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
